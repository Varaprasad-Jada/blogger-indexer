<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blogger Fast Indexer</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      max-width: 480px;
      width: 100%;
    }
    h2 {
      margin-top: 0;
      color: #1a1a1a;
      font-size: 22px;
    }
    p {
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }
    label {
      font-weight: 600;
      font-size: 13px;
      color: #333;
      display: block;
      margin-bottom: 6px;
    }
    input[type="text"], input[type="url"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      margin-bottom: 16px;
      font-size: 14px;
    }
    button {
      width: 100%;
      background-color: #2563eb;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    #status {
      margin-top: 20px;
      font-size: 14px;
      padding: 10px;
      border-radius: 6px;
      display: none;
    }
    .success {
      background-color: #dcfce7;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }
    .error {
      background-color: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Blogger Fast Indexer</h2>
    <p>Submit your new admission post URL to IndexNow and trigger a Google sitemap re-crawl instantly.</p>

    <label for="apiKey">IndexNow Key (from Bing Webmaster Tools):</label>
    <input type="text" id="apiKey" placeholder="e.g., 8d22f98..." />

    <label for="postUrl">Blogger Post URL:</label>
    <input type="url" id="postUrl" placeholder="https://yourblog.blogspot.com/2026/09/post.html" required />

    <button onclick="submitIndexing()">Index Post Now</button>

    <div id="status"></div>
  </div>

  <script>
    async function submitIndexing() {
      const urlInput = document.getElementById('postUrl').value.trim();
      const apiKey = document.getElementById('apiKey').value.trim();
      const statusDiv = document.getElementById('status');

      if (!urlInput) {
        showStatus('Please enter a valid Blogger post URL.', 'error');
        return;
      }

      showStatus('Submitting crawl request...', 'success');

      try {
        const parsedUrl = new URL(urlInput);
        const host = parsedUrl.hostname;

        // 1. Submit to IndexNow API (Bing / Yahoo)
        if (apiKey) {
          const payload = {
            host: host,
            key: apiKey,
            keyLocation: `https://${host}/${apiKey}.txt`,
            urlList: [urlInput]
          };

          await fetch('https://api.indexnow.org/indexnow', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json; charset=utf-8' },
            body: JSON.stringify(payload)
          });
        }

        // 2. Ping Google Sitemap Endpoint via a transparent image request
        const googlePingUrl = `https://www.google.com/ping?sitemap=https://${host}/sitemap.xml`;
        const img = new Image();
        img.src = googlePingUrl;

        showStatus('Success! Sent IndexNow signal and pinged Google Sitemap queue.', 'success');
      } catch (err) {
        showStatus('Error: ' + err.message, 'error');
      }
    }

    function showStatus(msg, type) {
      const statusDiv = document.getElementById('status');
      statusDiv.style.display = 'block';
      statusDiv.className = type;
      statusDiv.innerText = msg;
    }
  </script>

</body>
</html>
